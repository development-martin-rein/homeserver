apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-gateway-tls
  namespace: gateway-system
spec:
  secretName: home-gateway-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
  dnsNames:
    - "*.home.lan"
    - nextcloud.home.lan
  issuerRef:
    name: home-lan-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io

