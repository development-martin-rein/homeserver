apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  interval: 10m
  releaseName: cloudnative-pg
  targetNamespace: cnpg-system

  chart:
    spec:
      chart: cloudnative-pg
      version: 0.28.2
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
      reconcileStrategy: ChartVersion

  install:
    createNamespace: true
    crds: CreateReplace

  upgrade:
    crds: CreateReplace
