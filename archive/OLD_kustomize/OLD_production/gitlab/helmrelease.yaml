apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: gitlab-production
spec:
  interval: 30m
  timeout: 60m
  chart:
    spec:
      chart: gitlab
      version: 10.0.0
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: gitlab-production
      interval: 12h
  install:
    remediation:
      retries: 0
  upgrade:
    remediation:
      retries: 0
  values:
    global:
      edition: ce
      hosts:
        domain: home.lan
        https: true
        gitlab:
          name: gitlab.home.lan
      ingress:
        enabled: false
        configureCertmanager: false
        tls:
          enabled: false
      gatewayApi:
        enabled: false
        installEnvoy: false
        configureCertmanager: false
      storage:
        class: longhorn
      psql:
        host: gitlab-postgresql-rw.gitlab-production.svc.cluster.local
        port: 5432
        database: gitlab
        username: gitlab
        preparedStatements: false
        password:
          secret: gitlab-postgresql-app
          key: password
      redis:
        host: gitlab-valkey.gitlab-production.svc.cluster.local
        port: 6379
        database: 0
        auth:
          enabled: true
          secret: gitlab-valkey
          key: password
      minio:
        enabled: false
      appConfig:
        object_store:
          enabled: true
          connection:
            secret: gitlab-minio
            key: connection
        lfs:
          enabled: true
          bucket: gitlab-lfs
          proxy_download: true
        artifacts:
          enabled: true
          bucket: gitlab-artifacts
          proxy_download: true
        uploads:
          enabled: true
          bucket: gitlab-uploads
          proxy_download: true
        packages:
          enabled: true
          bucket: gitlab-packages
          proxy_download: true
        externalDiffs:
          enabled: true
          bucket: gitlab-mr-diffs
          proxy_download: true
        terraformState:
          enabled: true
          bucket: gitlab-terraform-state
        ciSecureFiles:
          enabled: true
          bucket: gitlab-ci-secure-files
        dependencyProxy:
          enabled: true
          bucket: gitlab-dependency-proxy
        agentPlanContent:
          enabled: true
          bucket: gitlab-agent-plan-content
        backups:
          bucket: gitlab-backups
          tmpBucket: gitlab-tmp
          objectStorage:
            backend: s3
      registry:
        bucket: gitlab-registry
    installCertmanager: false
    nginx-ingress:
      enabled: false
    prometheus:
      install: false
    gitlab-runner:
      install: false
    registry:
      enabled: true
      storage:
        secret: gitlab-registry-storage
        key: config
    postgresql:
      install: false
    redis:
      install: false
    minio:
      enabled: false
    gitlab:
      gitlab-exporter:
        enabled: false
      webservice:
        minReplicas: 1
        maxReplicas: 1
      sidekiq:
        minReplicas: 1
        maxReplicas: 1
      gitlab-shell:
        minReplicas: 1
        maxReplicas: 1
      kas:
        minReplicas: 1
        maxReplicas: 1
      gitaly:
        persistence:
          storageClass: longhorn
          size: 50Gi
      toolbox:
        persistence:
          storageClass: longhorn
          size: 10Gi
        backups:
          objectStorage:
            config:
              secret: gitlab-minio
              key: connection
