apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab-registry
  namespace: gitlab-production
spec:
  parentRefs:
    - name: home-gateway
      namespace: gateway-system
  hostnames:
    - registry.home.lan
  rules:
    - backendRefs:
        - name: gitlab-registry
          port: 5000
