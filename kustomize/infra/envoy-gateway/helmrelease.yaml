apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
  namespace: flux-system
spec:
  interval: 10m
  targetNamespace: envoy-gateway-system
  releaseName: eg
  chart:
    spec:
      chart: .
      version: v1.7.2
      sourceRef:
        kind: HelmRepository
        name: envoy-gateway
        namespace: flux-system
      reconcileStrategy: ChartVersion
  install:
    createNamespace: true
    crds: Skip
  upgrade:
    crds: Skip
  values:
    envoyProxy:
      service:
        type: LoadBalancer
        loadBalancerIP: 192.168.178.241
        annotations:
          metallb.universe.tf/loadBalancerIPs: 192.168.178.241
