apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-lan-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: HomeLab Local CA
  secretName: home-lan-ca
  duration: 87600h
  renewBefore: 720h
  privateKey:
    algorithm: RSA
    size: 4096
  issuerRef:
    name: home-lan-selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io

