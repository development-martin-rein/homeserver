apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitlab-valkey
  namespace: gitlab-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitlab-valkey
  template:
    metadata:
      labels:
        app: gitlab-valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports:
            - containerPort: 6379
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-valkey
                  key: password
          command:
            - sh
            - -c
            - exec valkey-server --requirepass "$VALKEY_PASSWORD" --appendonly yes
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitlab-valkey-data
