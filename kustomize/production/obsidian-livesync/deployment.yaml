apiVersion: apps/v1
kind: Deployment
metadata:
  name: couchdb
  namespace: obsidian-livesync-production
spec:
  replicas: 1
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app: couchdb
  template:
    metadata:
      labels:
        app: couchdb
    spec:
      initContainers:
        - name: copy-couchdb-config
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              cp /config/obsidian.ini /local.d/obsidian.ini
          volumeMounts:
            - name: couchdb-config
              mountPath: /config
            - name: couchdb-local-config
              mountPath: /local.d

      containers:
        - name: couchdb
          image: couchdb:3.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5984
          env:
            - name: COUCHDB_USER
              valueFrom:
                secretKeyRef:
                  name: couchdb-secret
                  key: COUCHDB_USER
            - name: COUCHDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: couchdb-secret
                  key: COUCHDB_PASSWORD
          volumeMounts:
            - name: couchdb-data
              mountPath: /opt/couchdb/data
            - name: couchdb-local-config
              mountPath: /opt/couchdb/etc/local.d

      volumes:
        - name: couchdb-data
          persistentVolumeClaim:
            claimName: couchdb-data

        - name: couchdb-config
          configMap:
            name: couchdb-config

        - name: couchdb-local-config
          emptyDir: {}
