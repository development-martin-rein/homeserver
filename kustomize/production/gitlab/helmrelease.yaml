apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab
  namespace: gitlab-production
spec:
  interval: 30m
  timeout: 30m

  chart:
    spec:
      chart: gitlab
      version: "10.0.0"
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: gitlab-production
      interval: 12h

  install:
    remediation:
      retries: 3

  upgrade:
    remediation:
      retries: 3

  values:
    global:
      edition: ce

      hosts:
        domain: home.lan
        https: true
        gitlab:
          name: gitlab.home.lan

      ingress:
        enabled: false
        configureCertmanager: false
        tls:
          enabled: false

      gatewayApi:
        enabled: false
        installEnvoy: false
        configureCertmanager: false

      storage:
        class: longhorn

      psql:
        host: gitlab-postgresql-rw.gitlab-production.svc.cluster.local
        port: 5432
        database: gitlab
        username: gitlab
        preparedStatements: false
        password:
          secret: gitlab-postgresql-app
          key: password

      redis:
        host: gitlab-valkey.gitlab-production.svc.cluster.local
        port: 6379
        database: 0
        auth:
          enabled: true
          secret: gitlab-valkey
          key: password

      minio:
        enabled: false

      appConfig:
        lfs:
          enabled: true
          bucket: gitlab-lfs
          connection:
            secret: gitlab-object-storage
            key: connection

        artifacts:
          enabled: true
          bucket: gitlab-artifacts
          connection:
            secret: gitlab-object-storage
            key: connection

        uploads:
          enabled: true
          bucket: gitlab-uploads
          connection:
            secret: gitlab-object-storage
            key: connection

        packages:
          enabled: true
          bucket: gitlab-packages
          connection:
            secret: gitlab-object-storage
            key: connection

        externalDiffs:
          enabled: true
          bucket: gitlab-mr-diffs
          connection:
            secret: gitlab-object-storage
            key: connection

        terraformState:
          enabled: true
          bucket: gitlab-terraform-state
          connection:
            secret: gitlab-object-storage
            key: connection

        ciSecureFiles:
          enabled: true
          bucket: gitlab-ci-secure-files
          connection:
            secret: gitlab-object-storage
            key: connection

        dependencyProxy:
          enabled: true
          bucket: gitlab-dependency-proxy
          connection:
            secret: gitlab-object-storage
            key: connection

    installCertmanager: false

    nginx-ingress:
      enabled: false

    prometheus:
      install: false

    gitlab-runner:
      install: false

    registry:
      enabled: false

    postgresql:
      install: false

    redis:
      install: false

    minio:
      enabled: false

    gitlab:
      webservice:
        minReplicas: 1
        maxReplicas: 1

      sidekiq:
        minReplicas: 1
        maxReplicas: 1

      gitaly:
        persistence:
          storageClass: longhorn
          size: 50Gi

      toolbox:
        persistence:
          storageClass: longhorn
          size: 10Gi
        backups:
          objectStorage:
            config:
              secret: gitlab-object-storage
              key: connection
