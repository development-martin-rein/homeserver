apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab
  namespace: gitlab-production
spec:
  parentRefs:
    - name: home-gateway
      namespace: gateway-system
  hostnames:
    - gitlab.system
  rules:
    - backendRefs:
        - name: gitlab-webservice-default
          port: 8181
