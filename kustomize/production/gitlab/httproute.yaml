apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitlab
  namespace: gitlab-production
spec:
  parentRefs:
    - name: home-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - gitlab.home.lan
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: gitlab-webservice-default
          port: 8181
