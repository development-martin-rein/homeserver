apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: couchdb-secret
  namespace: couchdb
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: couchdb-couchdb
    creationPolicy: Owner
  data:
    - secretKey: adminUsername
      remoteRef:
        key: COUCHDB_USER
    - secretKey: adminPassword
      remoteRef:
        key: COUCHDB_PASSWORD
    - secretKey: erlangCookie
      remoteRef:
        key: COUCHDB_SECRET
