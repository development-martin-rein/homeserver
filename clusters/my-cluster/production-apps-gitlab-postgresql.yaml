apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: production-apps-gitlab-postgresql
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kustomize/production/gitlab-postgresql
  dependsOn:
    - name: infra-cloudnative-pg
  timeout: 10m
