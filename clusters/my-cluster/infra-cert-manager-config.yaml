apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infra-cert-manager-config
  namespace: flux-system
spec:
  interval: 10m
  path: ./kustomize/infra/cert-manager-config
  prune: true
  wait: true
  timeout: 5m
  dependsOn:
    - name: infra-cert-manager
  sourceRef:
    kind: GitRepository
    name: flux-system
