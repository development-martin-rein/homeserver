apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: production-apps-obsidian-livesync
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 2m
  wait: true
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kustomize/production/obsidian-livesync
  dependsOn:
    - name: infra-gateway
  timeout: 10m
