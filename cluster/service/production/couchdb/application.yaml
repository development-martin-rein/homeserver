apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: couchdb
  namespace: argocd
spec:
  project: homeserver
  source:
    repoURL: https://apache.github.io/couchdb-helm
    chart: couchdb
    targetRevision: 4.6.1
    helm:
      releaseName: couchdb
      values: |
        persistentVolume:
          enabled: true
          size: 20Gi
          storageClass: longhorn

        couchdbConfig:
          couchdb:
            uuid: "7f4c1f6e-8c1b-4a6a-9d13-0f2b5d8e8b6f"

        createAdminSecret: false

        adminUsername: admin
        adminPassword: ""
        erlangFlags:
          setcookie: ""

  destination:
    server: https://kubernetes.default.svc
    namespace: couchdb
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
