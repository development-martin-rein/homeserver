apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical
  namespace: argocd
spec:
  project: homeserver

  source:
    repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    chart: infisical-standalone
    targetRevision: 1.8.0
    helm:
      releaseName: infisical
      values: |
        infisical:
          replicaCount: 1
          kubeSecretRef: infisical-secrets

        postgresql:
          enabled: false

        redis:
          enabled: false

        ingress:
          enabled: false
          nginx:
            enabled: false

        ingress-nginx:
          enabled: false

  destination:
    server: https://kubernetes.default.svc
    namespace: infisical

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
