apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: infisical
  namespace: infisical
spec:
  parentRefs:
    - name: home-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - infisical.home.lan
  rules:
    - backendRefs:
        - name: infisical-infisical-standalone-infisical
          port: 8080
