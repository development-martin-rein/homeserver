apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: homeserver
  namespace: argocd
spec:
  description: Homeserver project managed by Argo CD

  sourceRepos:
    - https://github.com/development-martin-rein/homeserver.git
    - quay.io/jetstack/charts
    - https://charts.longhorn.io

  destinations:
    - namespace: '*'
      server: https://kubernetes.default.svc

  clusterResourceWhitelist:
    - group: '*'
      kind: '*'

  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
