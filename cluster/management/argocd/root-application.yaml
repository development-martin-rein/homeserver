apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: homeserver-root
  namespace: argocd
spec:
  project: homeserver

  source:
    repoURL: https://github.com/development-martin-rein/homeserver.git
    targetRevision: main
    path: cluster

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
