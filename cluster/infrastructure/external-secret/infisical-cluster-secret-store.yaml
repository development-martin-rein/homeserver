apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: infisical
spec:
  provider:
    infisical:
      hostAPI: http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-universal-auth
            namespace: external-secret-system
            key: clientId
          clientSecret:
            name: infisical-universal-auth
            namespace: external-secret-system
            key: clientSecret
      secretsScope:
        projectSlug: homeserver-geoo
        environmentSlug: dev
        secretsPath: /
