apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-lan-tls
  namespace: gateway-system
spec:
  secretName: home-lan-tls
  dnsNames:
    - argocd.home.lan
    - infisical.home.lan
    - nextcloud.home.lan
    - gitlab.home.lan
  issuerRef:
    kind: ClusterIssuer
    name: home-lan-ca
