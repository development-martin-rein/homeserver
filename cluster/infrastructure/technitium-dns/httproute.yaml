apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: technitium
  namespace: technitium-dns
spec:
  hostnames:
    - technitium.home.lan
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: home-gateway
      namespace: gateway-system
      sectionName: https
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: technitium-web
          port: 5380
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
