apiVersion: apps/v1
kind: Deployment
metadata:
  name: technitium
  namespace: technitium-dns
  labels:
    app.kubernetes.io/name: technitium
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: technitium
  template:
    metadata:
      labels:
        app.kubernetes.io/name: technitium
    spec:
      containers:
        - name: technitium
          image: technitium/dns-server:15.2.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: web
              containerPort: 5380
              protocol: TCP

          env:
            - name: DNS_SERVER_DOMAIN
              value: technitium.home.lan
            - name: DNS_SERVER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: technitium-secret
                  key: adminPassword
            - name: DNS_SERVER_FORWARDERS
              value: 192.168.178.1

          volumeMounts:
            - name: technitium-data
              mountPath: /etc/dns

      volumes:
        - name: technitium-data
          persistentVolumeClaim:
            claimName: technitium-data
