apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: technitium-dns
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/development-martin-rein/homeserver.git
    targetRevision: HEAD
    path: cluster/infrastructure/technitium-dns

  destination:
    server: https://kubernetes.default.svc
    namespace: technitium-dns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
