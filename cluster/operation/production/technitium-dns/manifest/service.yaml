apiVersion: v1
kind: Service
metadata:
  name: technitium
  namespace: technitium-dns
  annotations:
    metallb.universe.tf/loadBalancerIPs: 192.168.178.250
spec:
  type: LoadBalancer
  loadBalancerIP: 192.168.178.250
  selector:
    app.kubernetes.io/name: technitium
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
    - name: web
      port: 5380
      targetPort: 5380
      protocol: TCP
