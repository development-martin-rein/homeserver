apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  name: couchdb
  namespace: couchdb
spec:
  parentRefs:
    - name: home-gateway
      namespace: gateway-system
      sectionName: https
  hostnames:
    - obsidian-sync.home.lan
  rules:
    - backendRefs:
        - name: couchdb-svc-couchdb
          port: 5984
